image: node:18-alpine

stages:
  - test
  - lint
  - security

cache:
  paths:
    - node_modules/

before_script:
  - npm ci --prefer-offline

test:
  stage: test
  script:
    - npm test

lint:
  stage: lint
  script:
    - npm run lint

security-audit:
  stage: security
  script:
    - npm audit
  allow_failure: true
